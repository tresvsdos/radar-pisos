<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23434E">
<title>Radar de pisos Zaragoza</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#EDF0EF; --surface:#FFF; --surface-2:#E3E8E7; --deep:#23434E; --deep-text:#EAF2F3;
  --text:#16262B; --muted:#5B6F70; --line:#CFD9D8; --line-soft:#DFE6E5;
  --accent:#2E7286; --accent-soft:#DCEAEE; --brick:#A6482F; --brick-soft:#F2DFD9;
  --ochre:#8A6212; --ochre-bg:#F3E4C4; --good:#2C6A55;
  --shadow:0 2px 4px rgba(22,38,43,.06),0 14px 34px rgba(22,38,43,.14);
  --ring:0 0 0 3px rgba(46,114,134,.4);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --slab:"Zilla Slab",Georgia,serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E181B; --surface:#17262B; --surface-2:#1E3138; --deep:#0A1316; --deep-text:#DCE9EB;
  --text:#E4EDEC; --muted:#93A8A9; --line:#2A3F45; --line-soft:#223339;
  --accent:#6FBACE; --accent-soft:#1C3B45; --brick:#E08468; --brick-soft:#3B211A;
  --ochre:#E3B45F; --ochre-bg:#3A2E12; --good:#6FBFA0;
  --shadow:0 2px 4px rgba(0,0,0,.4),0 16px 36px rgba(0,0,0,.45); --ring:0 0 0 3px rgba(111,186,206,.45);
}}
:root[data-theme="dark"]{
  --bg:#0E181B; --surface:#17262B; --surface-2:#1E3138; --deep:#0A1316; --deep-text:#DCE9EB;
  --text:#E4EDEC; --muted:#93A8A9; --line:#2A3F45; --line-soft:#223339;
  --accent:#6FBACE; --accent-soft:#1C3B45; --brick:#E08468; --brick-soft:#3B211A;
  --ochre:#E3B45F; --ochre-bg:#3A2E12; --good:#6FBFA0;
  --shadow:0 2px 4px rgba(0,0,0,.4),0 16px 36px rgba(0,0,0,.45); --ring:0 0 0 3px rgba(111,186,206,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:6px}
button{font-family:inherit}

header{background:var(--deep);color:var(--deep-text);padding:10px 16px calc(0px + 8px);position:sticky;top:0;z-index:20}
.cab{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--slab);font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.dia{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.7;margin:1px 0 0}
.tabs{display:flex;gap:3px;background:rgba(255,255,255,.1);border-radius:8px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--deep-text);opacity:.7;font-size:13px;font-weight:600;
  padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent);opacity:1}
.tabs .n{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:4px}

main{max-width:520px;margin:0 auto;padding:14px 16px 24px}

.pila{position:relative;height:min(640px,calc(100dvh - 250px));min-height:430px}
.tarjeta{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform}
.tarjeta.suave{transition:transform .3s cubic-bezier(.22,.61,.36,1)}
.tarjeta.detras{transform:scale(.945) translateY(16px);pointer-events:none;box-shadow:none;opacity:.85}
.tarjeta:active{cursor:grabbing}

.visor{position:relative;flex:0 0 52%;background:var(--surface-2);overflow:hidden}
.visor img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
.sinfoto{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:24px;text-align:center;color:var(--muted);font-size:13px}
.sinfoto b{font-family:var(--slab);font-size:17px;color:var(--text)}
.tiras{position:absolute;z-index:3;top:9px;left:9px;right:9px;display:flex;gap:4px}
.tiras i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.4);box-shadow:0 0 2px rgba(0,0,0,.3)}
.tiras i.on{background:#fff}
.etiqueta{position:absolute;z-index:3;left:12px;bottom:12px;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:5px 9px;border-radius:4px;background:var(--ochre-bg);color:var(--ochre)}
.etiqueta.baja{background:var(--brick-soft);color:var(--brick)}
.contador{position:absolute;z-index:3;right:12px;bottom:12px;font-family:var(--mono);font-size:11px;font-weight:600;
  background:rgba(11,20,23,.62);color:#fff;padding:5px 8px;border-radius:4px;font-variant-numeric:tabular-nums}
.sello{position:absolute;z-index:4;top:34px;font-family:var(--slab);font-size:27px;font-weight:700;padding:7px 14px;
  border-radius:8px;border:3px solid;background:rgba(255,255,255,.94);opacity:0;pointer-events:none}
.sello.si{left:20px;color:var(--good);border-color:var(--good);transform:rotate(-11deg)}
.sello.no{right:20px;color:var(--brick);border-color:var(--brick);transform:rotate(11deg)}

.info{flex:1;min-height:0;padding:13px 16px 14px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
.alto{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dir{font-family:var(--slab);font-size:20px;font-weight:600;line-height:1.18;margin:0;text-wrap:balance}
.sitio{margin:3px 0 0;font-size:13px;color:var(--muted)}
.precio{text-align:right;flex-shrink:0}
.precio b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.precio s{display:block;font-family:var(--mono);font-size:11px;color:var(--brick)}
.precio small{display:block;font-size:10.5px;color:var(--muted);max-width:110px;line-height:1.3;margin-top:2px}
.rejilla{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:8px;overflow:hidden}
.rejilla div{background:var(--surface);padding:7px 9px;min-width:0}
.rejilla b{display:block;font-family:var(--mono);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rejilla span{display:block;font-size:10px;color:var(--muted);letter-spacing:.02em}
.frase{margin:0;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.frase strong{font-weight:600}
.frase.mejor strong{color:var(--good)}
.frase.ojo strong{color:var(--brick)}
.enlaces{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:2px}
.enlaces a{font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;
  border:1px solid var(--accent-soft);border-radius:6px;padding:6px 10px}
.enlaces a:hover{border-color:var(--accent)}

.mandos{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:18px}
.mando{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:500}
.redondo{border-radius:50%;border:2px solid;background:var(--surface);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 3px 10px rgba(22,38,43,.13);padding:0;transition:transform .12s}
.redondo:hover{transform:scale(1.06)}
.redondo:disabled{opacity:.3;cursor:default;transform:none}
.ayuda{text-align:center;font-size:12px;color:var(--muted);margin:14px 0 0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.panel h2{font-family:var(--slab);font-size:20px;margin:0 0 6px;font-weight:600}
.panel p{margin:0;color:var(--muted)}
.fila{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;
  padding:10px;margin-bottom:10px}
.mini{width:86px;height:86px;border-radius:7px;overflow:hidden;flex-shrink:0;background:var(--surface-2)}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.fila .cuerpo{flex:1;min-width:0}
.fila h3{font-family:var(--slab);font-size:16px;margin:0;font-weight:600}
.fila .p{font-family:var(--mono);font-size:15px;font-weight:600;white-space:nowrap}
.fila .z{margin:2px 0 0;font-size:12px;color:var(--muted)}
.acc{display:flex;flex-wrap:wrap;gap:12px;margin-top:7px}
.acc a,.acc button{font-size:12.5px;font-weight:600;color:var(--accent);background:none;border:0;padding:0;
  cursor:pointer;text-decoration:underline}
.acc button.rojo{color:var(--brick)}
.tachado{text-decoration:line-through;color:var(--muted)}

.envio{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));margin-top:18px;z-index:10}
.envio .in{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.envio p{margin:0;font-size:12.5px;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:11px 15px;font-weight:600;font-size:14px;
  cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
@media (prefers-reduced-motion:reduce){.tarjeta,.redondo{transition:none!important}}
</style>
</head>
<body>
<header><div class="cab">
  <div><h1>Piso sí, piso no</h1><p class="dia" id="dia">Zaragoza</p></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>
</div></header>
<main id="vista"><div class="panel"><p>Cargando los pisos…</p></div></main>
<div class="envio" id="envio" hidden><div class="in"><p id="envio-txt"></p><div id="envio-btns" style="display:flex;gap:8px;flex-wrap:wrap"></div></div></div>

<script>
(function(){
  var D={pisos:[],fecha:'',circe:null,destinatario:''}, E=[], hist=[], tab='decidir', arriba=null, foto={};
  var CLAVE='radar-pisos-zgz';
  var ICON={
    no:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    si:'<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.8 1.2 5.4 3.1 1.6-1.9 3.3-3.1 5.4-3.1 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>',
    atras:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>'};

  try{E=JSON.parse(localStorage.getItem(CLAVE)||'[]');}catch(e){}
  try{D.destinatario=localStorage.getItem('radar-dest')||'';}catch(e){}
  function pedirDireccion(){
    var v=prompt('¿A qué dirección envío las decisiones?',D.destinatario||'');
    if(v==null) return;
    v=v.trim();
    if(v&&v.indexOf('@')<1){alert('Esa dirección no parece un correo.');return;}
    D.destinatario=v;
    try{v?localStorage.setItem('radar-dest',v):localStorage.removeItem('radar-dest');}catch(e){}
    pintarEnvio();
  }
  function guardar(){try{localStorage.setItem(CLAVE,JSON.stringify(E));}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function eur(n){return n==null?'—':Number(n).toLocaleString('es-ES')+' €';}
  function km(n){return Number(n).toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1});}
  function tope(v,a,b){return Math.max(a,Math.min(b,v));}
  var porId={};
  function indexar(){porId={};D.pisos.forEach(function(p){porId[p.id]=p;});}
  function vigente(id){var d=null;E.forEach(function(x){if(x.id===id)d=x.d==='reset'?null:x.d;});return d;}
  function orig(p){return p.lat!=null&&p.lng!=null?p.lat+','+p.lng:encodeURIComponent((p.direccion||'')+', Zaragoza');}
  function mapa(p){return 'https://www.google.com/maps/search/?api=1&query='+orig(p);}
  function ruta(p){var c=D.circe,d=c&&c.lat!=null?c.lat+','+c.lng:encodeURIComponent('Avenida Ranillas 3D, 50018 Zaragoza');
    return 'https://www.google.com/maps/dir/?api=1&origin='+orig(p)+'&destination='+d+'&travelmode=transit';}

  function pila(){
    var o={nuevo:0,baja:1,subida:2,sigue:3};
    return D.pisos.filter(function(p){return !vigente(p.id);}).sort(function(a,b){
      return ((o[a.estado]==null?4:o[a.estado])-(o[b.estado]==null?4:o[b.estado]))||((b.puntuacion||0)-(a.puntuacion||0));});
  }
  function porDec(d){
    var v={},out=[];
    for(var i=E.length-1;i>=0;i--){var id=E[i].id;
      if(!v[id]&&vigente(id)===d&&porId[id]){v[id]=1;out.push(porId[id]);}}
    return out;
  }

  function tarjeta(p,n,total){
    var fs=(p.fotos||[]).filter(Boolean), i=foto[p.id]||0, f=fs[i];
    var mu={confirmado:['Amueblado','confirmado'],marcado:['Amueblado','por confirmar'],dudoso:['Muebles','solo cocina']}[p.muebles]||['Muebles','sin datos'];
    var planta=(p.planta||'—')+(p.exterior===true?' ext.':p.exterior===false?' int.':'');
    var h='<div class="visor">';
    h+='<div class="sinfoto"><b>'+esc(p.zona||'Zaragoza')+'</b><span>'+(fs.length?'La foto no ha cargado, ábrela en el anuncio':'El anuncio no trae fotos')+'</span></div>';
    if(f) h+='<img src="'+esc(f)+'" alt="Foto de '+esc(p.direccion)+'" referrerpolicy="no-referrer" draggable="false" onerror="this.style.visibility=\'hidden\'">';
    if(fs.length>1){h+='<div class="tiras">';for(var k=0;k<fs.length;k++)h+='<i class="'+(k===i?'on':'')+'"></i>';h+='</div>';}
    if(p.estado==='nuevo') h+='<span class="etiqueta">Nuevo</span>';
    else if(p.estado==='baja') h+='<span class="etiqueta baja">Baja de precio</span>';
    h+='<span class="contador">'+n+' / '+total+'</span>';
    h+='<span class="sello si">Me gusta</span><span class="sello no">Ni de coña</span></div>';
    h+='<div class="info"><div class="alto"><div style="min-width:0">';
    h+='<h2 class="dir">'+esc(p.direccion)+'</h2>';
    h+='<p class="sitio">'+esc(p.zona||'')+(p.distancia_km!=null?', a '+km(p.distancia_km)+' km de CIRCE':'')+'</p></div>';
    h+='<div class="precio"><b>'+eur(p.precio)+'</b>'+(p.precio_anterior?'<s>antes '+eur(p.precio_anterior)+'</s>':'')
      +(p.nota_precio?'<small>'+esc(p.nota_precio)+'</small>':'')+'</div></div>';
    h+='<div class="rejilla">'
      +'<div><b>'+(p.m2!=null?p.m2+' m²':'—')+'</b><span>'+(p.habitaciones||'—')+' hab, '+(p.banos||'—')+' baño'+(p.banos===1?'':'s')+'</span></div>'
      +'<div><b>'+esc(planta)+'</b><span>'+(p.ascensor===true?'con ascensor':p.ascensor===false?'sin ascensor':'ascensor n/d')+'</span></div>'
      +'<div><b>'+(p.puntuacion!=null?p.puntuacion+' pts':'—')+'</b><span>'+esc(mu[0].toLowerCase()+', '+mu[1])+'</span></div>'
      +'</div>';
    if(p.andando_min!=null) h+='<p class="frase" style="color:var(--muted);font-size:12.5px">'+p.andando_min+' min andando, '+(p.bici_min!=null?p.bici_min+' min en bici, ':'')+'aprox.</p>';
    if(p.lo_mejor) h+='<p class="frase mejor"><strong>Lo mejor:</strong> '+esc(p.lo_mejor)+'</p>';
    if(p.ojo) h+='<p class="frase ojo"><strong>Ojo:</strong> '+esc(p.ojo)+'</p>';
    h+='<div class="enlaces">'+(p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noreferrer">Abrir anuncio</a>':'')
      +'<a href="'+esc(mapa(p))+'" target="_blank" rel="noreferrer">Mapa</a>'
      +'<a href="'+esc(ruta(p))+'" target="_blank" rel="noreferrer">Ruta a CIRCE</a></div></div>';
    return h;
  }

  function mover(el,x,y){
    el.style.transform='translate('+x+'px,'+(y*.22)+'px) rotate('+(x/24)+'deg)';
    el.querySelector('.sello.si').style.opacity=tope(x/105,0,1);
    el.querySelector('.sello.no').style.opacity=tope(-x/105,0,1);
  }
  function volar(el,p,d){
    if(el.dataset.fuera) return;
    el.dataset.fuera='1';
    el.classList.add('suave');
    mover(el,d==='si'?innerWidth+320:-(innerWidth+320),200);
    setTimeout(function(){decidir(p,d);},280);
  }
  function pasarFoto(el,p,paso){
    var fs=(p.fotos||[]).filter(Boolean); if(fs.length<2) return;
    var i=tope((foto[p.id]||0)+paso,0,fs.length-1); foto[p.id]=i;
    var img=el.querySelector('.visor img'); if(img){img.style.visibility='';img.src=fs[i];}
    el.querySelectorAll('.tiras i').forEach(function(b,k){b.className=k===i?'on':'';});
  }
  function arrastre(el,p){
    var s=null,x=0,y=0;
    el.addEventListener('pointerdown',function(e){
      if(el.dataset.fuera||e.target.closest('a,button')) return;
      s={x:e.clientX,y:e.clientY,t:Date.now(),foto:!!e.target.closest('.visor'),r:el.getBoundingClientRect()};
      x=0;y=0; el.classList.remove('suave');
      try{el.setPointerCapture(e.pointerId);}catch(err){}
    });
    el.addEventListener('pointermove',function(e){
      if(!s) return;
      x=e.clientX-s.x; y=e.clientY-s.y; mover(el,x,y);
    });
    function fin(){
      if(!s) return;
      var st=s; s=null; el.classList.add('suave');
      if(Math.abs(x)<9&&Math.abs(y)<9){
        mover(el,0,0);
        if(st.foto) pasarFoto(el,p,(st.x-st.r.left)/st.r.width<.4?-1:1);
        return;
      }
      var v=x/Math.max(1,Date.now()-st.t);
      if(x>105||(v>.65&&x>45)) volar(el,p,'si');
      else if(x<-105||(v<-.65&&x<-45)) volar(el,p,'no');
      else mover(el,0,0);
    }
    el.addEventListener('pointerup',fin);
    el.addEventListener('pointercancel',fin);
  }

  function decidir(p,d,apuntar){
    var x={id:p.id,d:d,dir:p.direccion||'',t:Date.now()};
    E.push(x); if(apuntar!==false) hist.push(x);
    guardar(); pintar();
  }
  function deshacer(){
    var x=hist.pop(); if(!x) return;
    var i=E.indexOf(x);
    if(i>=0&&!x.enviado) E.splice(i,1);
    else E.push({id:x.id,d:'reset',dir:x.dir,t:Date.now()});
    guardar(); tab='decidir'; pintar();
  }
  function cambiar(p,d){
    if(!p) return;
    for(var i=E.length-1;i>=0;i--){
      if(E[i].id===p.id){
        if(!E[i].enviado){E.splice(i,1); if(vigente(p.id)===d||(d==='reset'&&!vigente(p.id))){guardar();pintar();return;}}
        break;
      }
    }
    decidir(p,d,false);
  }

  function filaHTML(p,tipo){
    var f=(p.fotos||[]).filter(Boolean)[0];
    var h='<div class="fila"><div class="mini">'+(f?'<img src="'+esc(f)+'" alt="" referrerpolicy="no-referrer" onerror="this.remove()">':'')+'</div><div class="cuerpo">';
    h+='<div class="alto"><h3'+(tipo==='no'?' class="tachado"':'')+'>'+esc(p.direccion)+'</h3><span class="p">'+eur(p.precio)+'</span></div>';
    h+='<p class="z">'+esc(p.zona||'')+(p.m2?', '+p.m2+' m²':'')+(p.distancia_km!=null?', a '+km(p.distancia_km)+' km':'')+'</p>';
    h+='<div class="acc">';
    if(p.url) h+='<a href="'+esc(p.url)+'" target="_blank" rel="noreferrer">Abrir anuncio</a>';
    if(tipo==='si'){h+='<a href="'+esc(ruta(p))+'" target="_blank" rel="noreferrer">Ruta a CIRCE</a>'
      +'<button class="rojo" data-accion="no" data-id="'+esc(p.id)+'">Descartar</button>';}
    else h+='<button data-accion="reset" data-id="'+esc(p.id)+'">Recuperar</button>';
    return h+'</div></div></div>';
  }

  function lotes(){
    var pend=E.filter(function(x){return !x.enviado;});
    if(!pend.length||!D.destinatario) return [];
    var movil=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
    function cuerpo(xs,dir){return xs.map(function(x){return x.d+' '+x.id+(dir&&x.dir?' | '+x.dir:'');}).join('\n');}
    function url(b,n,t){
      var su='[Radar pisos] decisiones '+D.fecha+(t>1?' ('+n+' de '+t+')':'');
      return movil?'mailto:'+D.destinatario+'?subject='+encodeURIComponent(su)+'&body='+encodeURIComponent(b)
        :'https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(D.destinatario)+'&su='+encodeURIComponent(su)+'&body='+encodeURIComponent(b);
    }
    var u=url(cuerpo(pend,true),1,1); if(u.length<=1900) return [{url:u,xs:pend,movil:movil}];
    u=url(cuerpo(pend,false),1,1);   if(u.length<=1900) return [{url:u,xs:pend,movil:movil}];
    var g=[]; for(var i=0;i<pend.length;i+=30) g.push(pend.slice(i,i+30));
    return g.map(function(xs,k){return {url:url(cuerpo(xs,false),k+1,g.length),xs:xs,movil:movil};});
  }
  function copiar(){
    var pend=E.filter(function(x){return !x.enviado;});
    var t=(D.destinatario?'Para: '+D.destinatario+'\n':'')+'Asunto: [Radar pisos] decisiones '+D.fecha+'\n\n'
      +pend.map(function(x){return x.d+' '+x.id+(x.dir?' | '+x.dir:'');}).join('\n');
    var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);
    if(navigator.clipboard) navigator.clipboard.writeText(t).catch(function(){});
    pend.forEach(function(x){x.enviado=true;}); guardar(); pintarEnvio();
    alert('Copiado. Pégalo en un correo y envíalo.');
  }
  function pintarEnvio(){
    var caja=document.getElementById('envio'), pend=E.filter(function(x){return !x.enviado;}).length;
    if(!E.length){caja.hidden=true;return;}
    caja.hidden=false;
    document.getElementById('envio-txt').textContent=pend
      ?(pend===1?'1 decisión sin enviar':pend+' decisiones sin enviar')+'. Se aplican mañana.'
      :'Todo enviado.';
    var b=document.getElementById('envio-btns'); b.innerHTML='';
    var ls=lotes();
    if(pend&&!D.destinatario){
      var q=document.createElement('button'); q.className='btn'; q.textContent='Elegir dirección';
      q.onclick=pedirDireccion; b.appendChild(q);
    }
    ls.forEach(function(l,k){
      var a=document.createElement('a'); a.className='btn'; a.href=l.url;
      if(!l.movil){a.target='_blank';a.rel='noreferrer';}
      a.textContent=ls.length>1?'Enviar parte '+(k+1):'Enviar decisiones';
      a.addEventListener('click',function(){setTimeout(function(){l.xs.forEach(function(x){x.enviado=true;});guardar();pintarEnvio();},400);});
      b.appendChild(a);
    });
    if(pend){var c=document.createElement('button');c.className='btn sec';c.textContent='Copiar';c.onclick=copiar;b.appendChild(c);}
    if(D.destinatario){var m=document.createElement('button');m.className='btn sec';m.textContent='Dirección';m.title=D.destinatario;m.onclick=pedirDireccion;b.appendChild(m);}
  }

  function pintar(){
    var P=pila(), F=porDec('si'), X=porDec('no');
    var T=[['decidir','Decidir',P.length],['si','Favoritos',F.length],['no','Descartados',X.length]];
    document.getElementById('tabs').innerHTML=T.map(function(t){
      return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'<span class="n">'+t[2]+'</span></button>';}).join('');
    if(D.fecha){var f=new Date(D.fecha+'T12:00:00');
      document.getElementById('dia').textContent=isNaN(f)?D.fecha:f.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});}
    var v=document.getElementById('vista'); arriba=null;

    if(tab==='decidir'){
      if(!P.length){
        v.innerHTML='<div class="panel"><h2>No queda nada por decidir</h2><p>'
          +(E.some(function(x){return !x.enviado;})?'Pulsa «Enviar decisiones» abajo para que cuenten mañana.':'Mañana a las 8:00 llegan los nuevos.')+'</p></div>';
      }else{
        var total=D.pisos.length, n=total-P.length+1;
        v.innerHTML='<div class="pila" id="pila"></div><div class="mandos">'
          +'<div class="mando"><button class="redondo" id="b-no" aria-label="Ni de coña" style="width:64px;height:64px;color:var(--brick);border-color:var(--brick)">'+ICON.no+'</button>Ni de coña</div>'
          +'<div class="mando"><button class="redondo" id="b-atras" aria-label="Deshacer" style="width:46px;height:46px;color:var(--muted);border-color:var(--line)"'+(hist.length?'':' disabled')+'>'+ICON.atras+'</button>Deshacer</div>'
          +'<div class="mando"><button class="redondo" id="b-si" aria-label="Me gusta" style="width:64px;height:64px;color:#fff;background:var(--good);border-color:var(--good)">'+ICON.si+'</button>Me gusta</div>'
          +'</div><p class="ayuda">Arrastra la tarjeta a un lado o usa los botones. Toca la foto por los bordes para ver las demás.</p>';
        var pl=document.getElementById('pila');
        if(P[1]){var b=document.createElement('article');b.className='tarjeta detras';b.innerHTML=tarjeta(P[1],n+1,total);pl.appendChild(b);}
        var t=document.createElement('article');t.className='tarjeta';t.innerHTML=tarjeta(P[0],n,total);pl.appendChild(t);
        arrastre(t,P[0]); arriba={el:t,p:P[0]};
        document.getElementById('b-no').onclick=function(){volar(t,P[0],'no');};
        document.getElementById('b-si').onclick=function(){volar(t,P[0],'si');};
        document.getElementById('b-atras').onclick=deshacer;
      }
    }else if(tab==='si'){
      v.innerHTML=F.length?F.map(function(p){return filaHTML(p,'si');}).join('')
        :'<div class="panel"><h2>Sin favoritos todavía</h2><p>Arrastra a la derecha los pisos que te gusten.</p></div>';
    }else{
      v.innerHTML=X.length?'<p style="margin:0 0 10px;font-size:12.5px;color:var(--muted)">No volverán a salir, aunque se republiquen.</p>'
        +X.map(function(p){return filaHTML(p,'no');}).join('')
        :'<div class="panel"><h2>Sin descartes</h2><p>Aquí aparece lo que arrastres a la izquierda.</p></div>';
    }
    v.querySelectorAll('[data-accion]').forEach(function(b){b.onclick=function(){cambiar(porId[b.dataset.id],b.dataset.accion);};});
    pintarEnvio();
  }

  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-tab]');
    if(t){tab=t.dataset.tab;pintar();}
  });
  document.addEventListener('keydown',function(e){
    if(tab!=='decidir'||!arriba) return;
    if(e.key==='ArrowRight') volar(arriba.el,arriba.p,'si');
    else if(e.key==='ArrowLeft') volar(arriba.el,arriba.p,'no');
    else if(e.key==='Backspace'){e.preventDefault();deshacer();}
  });
  addEventListener('beforeunload',function(e){
    if(E.some(function(x){return !x.enviado;})){e.preventDefault();e.returnValue='';}
  });

  fetch('datos.json?v='+Date.now()).then(function(r){
    if(!r.ok) throw new Error('No se ha podido leer datos.json ('+r.status+')');
    return r.json();
  }).then(function(j){
    D.pisos=j.pisos||[]; D.fecha=j.fecha||''; D.circe=j.circe||null; D.destinatario=D.destinatario||j.destinatario||'';
    indexar(); pintar();
  }).catch(function(err){
    document.getElementById('vista').innerHTML='<div class="panel"><h2>No hay datos que mostrar</h2><p>'+esc(err.message)+'</p></div>';
  });
})();
</script>
</body>
</html>
