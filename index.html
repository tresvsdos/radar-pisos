<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23434E">
<title>Radar de pisos Zaragoza</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#EDF0EF; --surface:#FFF; --surface-2:#E3E8E7; --deep:#23434E; --deep-text:#EAF2F3;
  --text:#16262B; --muted:#5B6F70; --line:#CFD9D8; --line-soft:#DFE6E5;
  --accent:#2E7286; --accent-soft:#DCEAEE; --brick:#A6482F; --brick-soft:#F2DFD9;
  --ochre:#8A6212; --ochre-bg:#F3E4C4; --good:#2C6A55;
  --shadow:0 2px 4px rgba(22,38,43,.06),0 18px 40px rgba(22,38,43,.15);
  --ring:0 0 0 3px rgba(46,114,134,.4);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --slab:"Zilla Slab",Georgia,serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E181B; --surface:#17262B; --surface-2:#1E3138; --deep:#0A1316; --deep-text:#DCE9EB;
  --text:#E4EDEC; --muted:#93A8A9; --line:#2A3F45; --line-soft:#223339;
  --accent:#6FBACE; --accent-soft:#1C3B45; --brick:#E08468; --brick-soft:#3B211A;
  --ochre:#E3B45F; --ochre-bg:#3A2E12; --good:#6FBFA0;
  --shadow:0 2px 4px rgba(0,0,0,.4),0 18px 42px rgba(0,0,0,.5); --ring:0 0 0 3px rgba(111,186,206,.45);
}}
:root[data-theme="dark"]{
  --bg:#0E181B; --surface:#17262B; --surface-2:#1E3138; --deep:#0A1316; --deep-text:#DCE9EB;
  --text:#E4EDEC; --muted:#93A8A9; --line:#2A3F45; --line-soft:#223339;
  --accent:#6FBACE; --accent-soft:#1C3B45; --brick:#E08468; --brick-soft:#3B211A;
  --ochre:#E3B45F; --ochre-bg:#3A2E12; --good:#6FBFA0;
  --shadow:0 2px 4px rgba(0,0,0,.4),0 18px 42px rgba(0,0,0,.5); --ring:0 0 0 3px rgba(111,186,206,.45);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:6px}
button{font-family:inherit}

header{background:var(--deep);color:var(--deep-text);padding:11px 20px 10px;position:sticky;top:0;z-index:30}
.cab{max-width:1020px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
h1{font-family:var(--slab);font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.dia{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.7;margin:1px 0 0}
.tabs{display:flex;gap:3px;background:rgba(255,255,255,.1);border-radius:9px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--deep-text);opacity:.7;font-size:13px;font-weight:600;
  padding:7px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent);opacity:1}
.tabs .n{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:4px}
main{max-width:1020px;margin:0 auto;padding:18px 20px 26px}

.pila{position:relative;height:min(660px,calc(100dvh - 235px));min-height:500px}
.tarjeta{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:1.08fr 1fr;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform}
.tarjeta.suave{transition:transform .3s cubic-bezier(.22,.61,.36,1)}
.tarjeta.detras{transform:scale(.955) translateY(15px);pointer-events:none;box-shadow:none;opacity:.8}
.tarjeta:active{cursor:grabbing}

.izq{position:relative;display:grid;background:var(--surface-2);min-width:0;min-height:0}
.visor{position:relative;overflow:hidden;background:var(--surface-2)}
.visor img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
.sinfoto{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:24px;text-align:center;color:var(--muted);font-size:13px}
.sinfoto b{font-family:var(--slab);font-size:17px;color:var(--text)}
.tiras{position:absolute;z-index:4;top:9px;left:10px;right:10px;display:flex;gap:4px}
.tiras{max-width:100%}
.tiras.muchas{display:none}
.tiras i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.42);box-shadow:0 0 2px rgba(0,0,0,.35)}
.tiras i.on{background:#fff}
.flecha{position:absolute;z-index:5;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;
  border:0;display:grid;place-items:center;cursor:pointer;color:#fff;background:rgba(11,20,23,.5);
  backdrop-filter:blur(3px);opacity:.85;transition:opacity .15s,background .15s}
.flecha:hover{opacity:1;background:rgba(11,20,23,.75)}
.flecha.a{left:9px} .flecha.b{right:9px}
.flecha[disabled]{opacity:.22;cursor:default}
.etiqueta{position:absolute;z-index:4;left:10px;bottom:10px;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;padding:5px 9px;border-radius:4px;background:var(--ochre-bg);color:var(--ochre)}
.etiqueta.baja{background:var(--brick-soft);color:var(--brick)}
.estancia{position:absolute;z-index:4;right:10px;top:10px;font-size:11px;font-weight:600;background:rgba(11,20,23,.55);color:#fff;padding:4px 8px;border-radius:4px}
.nfoto{position:absolute;z-index:4;right:10px;bottom:10px;font-family:var(--mono);font-size:11px;font-weight:600;
  background:rgba(11,20,23,.55);color:#fff;padding:4px 8px;border-radius:4px;font-variant-numeric:tabular-nums}

.mapa{width:100%;height:100%;pointer-events:none;background:var(--surface-2);z-index:0}
.mapa .leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.7)}
.leyenda{position:absolute;z-index:4;left:10px;bottom:10px;display:flex;gap:10px;background:rgba(255,255,255,.9);
  border-radius:5px;padding:5px 9px;font-size:10.5px;font-weight:600;color:#16262B}
.leyenda span{display:flex;align-items:center;gap:4px}
.leyenda i{width:9px;height:9px;border-radius:50%;display:block;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.sello{position:absolute;z-index:8;top:38px;font-family:var(--slab);font-size:28px;font-weight:700;padding:8px 16px;
  border-radius:9px;border:3px solid;background:rgba(255,255,255,.95);opacity:0;pointer-events:none}
.sello.si{left:24px;color:var(--good);border-color:var(--good);transform:rotate(-11deg)}
.sello.no{right:24px;color:var(--brick);border-color:var(--brick);transform:rotate(11deg)}

.der{padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0;overflow-y:auto}
.alto{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.dir{font-family:var(--slab);font-size:25px;font-weight:600;line-height:1.14;margin:0;text-wrap:balance}
.sitio{margin:5px 0 0;font-size:13.5px;color:var(--muted)}
.precio{text-align:right;flex-shrink:0}
.precio b{display:block;font-family:var(--mono);font-size:27px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.precio s{display:block;font-family:var(--mono);font-size:12px;color:var(--brick);margin-top:1px}
.precio small{display:block;font-size:11px;color:var(--muted);max-width:130px;line-height:1.35;margin-top:3px}
.tabla{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.tabla div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.tabla dt{font-size:12px;color:var(--muted);white-space:nowrap}
.tabla dd{margin:0;font-family:var(--mono);font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tabla dd.txt{font-family:var(--sans);font-weight:500}
.frase{margin:0;font-size:14px;line-height:1.5}
.frase strong{font-weight:600}
.frase.mejor strong{color:var(--good)} .frase.ojo strong{color:var(--brick)}
.enlaces{display:flex;flex-wrap:wrap;gap:9px;margin-top:auto;padding-top:6px}
.enlaces a{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;
  border:1px solid var(--accent-soft);border-radius:7px;padding:8px 12px}
.enlaces a:hover{border-color:var(--accent)}

.mandos{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:18px}
.mando{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:500}
.redondo{border-radius:50%;border:2px solid;background:var(--surface);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 3px 10px rgba(22,38,43,.13);padding:0;transition:transform .12s}
.redondo:hover{transform:scale(1.06)}
.redondo:disabled{opacity:.3;cursor:default;transform:none}
.ayuda{text-align:center;font-size:12px;color:var(--muted);margin:14px 0 0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.panel h2{font-family:var(--slab);font-size:21px;margin:0 0 6px;font-weight:600}
.panel p{margin:0;color:var(--muted)}
.fila{display:flex;gap:13px;background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:11px;margin-bottom:10px}
.mini{width:96px;height:96px;border-radius:7px;overflow:hidden;flex-shrink:0;background:var(--surface-2)}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.fila .cuerpo{flex:1;min-width:0}
.fila h3{font-family:var(--slab);font-size:17px;margin:0;font-weight:600}
.fila .p{font-family:var(--mono);font-size:16px;font-weight:600;white-space:nowrap}
.fila .z{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.acc{display:flex;flex-wrap:wrap;gap:13px;margin-top:8px}
.acc a,.acc button{font-size:12.5px;font-weight:600;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.acc button.rojo{color:var(--brick)}
.tachado{text-decoration:line-through;color:var(--muted)}
.fila.corta{align-items:center;padding:7px 10px;gap:10px;margin-bottom:6px}
.fila.corta .mini{width:56px;height:56px;border-radius:5px}
.fila.corta h3{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila.corta .p{font-size:14px}
.fila.corta .z{font-size:11.5px;margin:1px 0 0}
.fila.corta .acc{margin-top:3px;gap:10px}
.fila.corta .acc a,.fila.corta .acc button{font-size:11.5px}
.pos{flex-shrink:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pos.top{background:var(--accent);color:#fff}
.ordenar{display:flex;flex-direction:column;gap:3px;flex-shrink:0;justify-content:center}
.ordenar button{width:26px;height:22px;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:5px;cursor:pointer;font-size:11px;line-height:1;padding:0}
.ordenar button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.ordenar button:disabled{opacity:.3;cursor:default}
.caido{font-size:12.5px;font-weight:600;color:var(--brick);margin:3px 0 0}
.cambio{font-size:12.5px;font-weight:600;margin:3px 0 0}
.fila.caida{background:var(--brick-soft);border-color:var(--brick)}
.fila.caida .mini{opacity:.45}
.fila.caida h3,.fila.caida .p,.fila.caida .z{color:var(--brick)}
.fila.caida .pos{background:var(--brick);color:#fff}
.nota-orden{font-size:12.5px;color:var(--muted);margin:0 0 10px}

.envio{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 20px calc(10px + env(safe-area-inset-bottom));margin-top:18px;z-index:20}
.envio .in{max-width:1020px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.envio p{margin:0;font-size:12.5px;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:11px 15px;font-weight:600;font-size:14px;
  cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}

@media (max-width:880px){
  .pila{height:auto;min-height:0}
  .tarjeta{position:relative;grid-template-columns:1fr;grid-template-rows:auto auto}
  .tarjeta.detras{display:none}
  .izq{grid-template-rows:none;height:270px}
  .der{overflow:visible;padding:16px 17px 18px}
  .dir{font-size:21px} .precio b{font-size:23px}
  .tabla{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.tarjeta,.redondo,.flecha{transition:none!important}}
</style>
</head>
<body>
<header><div class="cab">
  <div><h1>Piso sí, piso no</h1><p class="dia" id="dia">Zaragoza</p></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>
</div></header>
<main id="vista"><div class="panel"><p>Cargando los pisos…</p></div></main>
<div class="envio" id="envio" hidden><div class="in"><p id="envio-txt"></p><div id="envio-btns" style="display:flex;gap:8px;flex-wrap:wrap"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var D={pisos:[],fecha:'',circe:null,destinatario:''}, E=[], hist=[], tab='decidir', arriba=null, foto={}, mapas=[];
  var CLAVE='radar-pisos-zgz';
  var ICON={
    no:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    si:'<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.8 1.2 5.4 3.1 1.6-1.9 3.3-3.1 5.4-3.1 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>',
    atras:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>',
    izq:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    der:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'};

  try{E=JSON.parse(localStorage.getItem(CLAVE)||'[]');}catch(e){}
  try{D.destinatario=localStorage.getItem('radar-dest')||'';}catch(e){}
  var ORDEN=[], COPIA={};
  try{ORDEN=JSON.parse(localStorage.getItem('radar-orden-fav')||'[]');}catch(e){}
  try{COPIA=JSON.parse(localStorage.getItem('radar-copia-fav')||'{}');}catch(e){}
  function guardarFav(){
    try{localStorage.setItem('radar-orden-fav',JSON.stringify(ORDEN));
        localStorage.setItem('radar-copia-fav',JSON.stringify(COPIA));}catch(e){}
  }
  function hoy(){return new Date().toISOString().slice(0,10);}
  function guardar(){try{localStorage.setItem(CLAVE,JSON.stringify(E));}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function eur(n){return n==null?'—':Number(n).toLocaleString('es-ES')+' €';}
  function km(n){return Number(n).toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1});}
  function tope(v,a,b){return Math.max(a,Math.min(b,v));}
  var porId={};
  var FUERA={};
  function indexar(){
    porId={}; FUERA={};
    D.pisos.forEach(function(p){porId[p.id]=p;});
    (D.fuera_de_filtro||[]).forEach(function(p){porId[p.id]=p;FUERA[p.id]=p.motivo_fuera||'Ya no cumple tus filtros';});
  }
  function vigente(id){var d=null;E.forEach(function(x){if(x.id===id)d=x.d==='reset'?null:x.d;});return d;}
  function orig(p){return p.lat!=null&&p.lng!=null?p.lat+','+p.lng:encodeURIComponent((p.direccion||'')+', Zaragoza');}
  function mapaUrl(p){return 'https://www.google.com/maps/search/?api=1&query='+orig(p);}
  function ruta(p){var c=D.circe,d=c&&c.lat!=null?c.lat+','+c.lng:encodeURIComponent('Avenida Ranillas 3D, 50018 Zaragoza');
    return 'https://www.google.com/maps/dir/?api=1&origin='+orig(p)+'&destination='+d+'&travelmode=transit';}
  function pedirDireccion(){
    var v=prompt('¿A qué dirección envío las decisiones?',D.destinatario||'');
    if(v==null) return; v=v.trim();
    if(v&&v.indexOf('@')<1){alert('Esa dirección no parece un correo.');return;}
    D.destinatario=v;
    try{v?localStorage.setItem('radar-dest',v):localStorage.removeItem('radar-dest');}catch(e){}
    pintarEnvio();
  }

  function urlFoto(f){
    if(!f) return "";
    var r=String(f).split("|")[0];
    if(r.indexOf("http")===0) return r;
    var i=r.indexOf("/");
    return (D.foto_base||"")+r.slice(0,i)+(D.foto_mid||"/")+r.slice(i+1)+".webp";
  }
  function tagFoto(f){var t=String(f||"").split("|")[1];return t||"";}
  function pila(){
    var o={nuevo:0,baja:1,subida:2,sigue:3};
    return D.pisos.filter(function(p){return !vigente(p.id)&&!FUERA[p.id];}).sort(function(a,b){
      return ((o[a.estado]==null?4:o[a.estado])-(o[b.estado]==null?4:o[b.estado]))||((b.puntuacion||0)-(a.puntuacion||0));});
  }
  function porDec(d){
    var v={},out=[];
    for(var i=E.length-1;i>=0;i--){var id=E[i].id; if(!v[id]&&vigente(id)===d&&porId[id]){v[id]=1;out.push(porId[id]);}}
    return out;
  }

  function dato(t,v,txt){return '<div><dt>'+t+'</dt><dd'+(txt?' class="txt"':'')+'>'+v+'</dd></div>';}
  function pases(p){
    var out=(p.fotos||[]).filter(Boolean).map(function(f){return {t:'f',v:f};});
    if(p.lat!=null&&p.lng!=null) out.splice(out.length?1:0,0,{t:'m'});
    return out;
  }
  function tarjeta(p,n,total){
    var fs=pases(p), i=Math.min(foto[p.id]||0,Math.max(0,fs.length-1)), f=fs[i];
    var mu={confirmado:'Confirmado',marcado:'Por confirmar',dudoso:'Solo cocina'}[p.muebles]||'Sin datos';
    var h='<div class="izq"><div class="visor">';
    h+='<div class="sinfoto"><b>'+esc(p.zona||'Zaragoza')+'</b><span>'+(fs.length?'La foto no ha cargado':'El anuncio no trae fotos')+'</span></div>';
    if(f&&f.t==='m'){
      h+='<div class="mapa" id="m-'+esc(p.id)+'-'+n+'"></div>';
      h+='<div class="leyenda"><span><i style="background:#2E7286"></i>Piso</span><span><i style="background:#A6482F"></i>CIRCE</span></div>';
      h+='<span class="estancia">Ubicación</span>';
    }else if(f){
      h+='<img src="'+esc(urlFoto(f.v))+'" alt="'+esc(tagFoto(f.v)||'Foto')+' de '+esc(p.direccion)+'" referrerpolicy="no-referrer" draggable="false" onerror="this.style.visibility=\'hidden\'">';
      if(tagFoto(f.v)) h+='<span class="estancia">'+esc(tagFoto(f.v))+'</span>';
    }
    if(fs.length>1){
      h+='<div class="tiras'+(fs.length>12?' muchas':'')+'">'; for(var k=0;k<fs.length;k++) h+='<i class="'+(k===i?'on':'')+'"></i>'; h+='</div>';
      h+='<button class="flecha a" data-paso="-1" data-id="'+esc(p.id)+'" aria-label="Foto anterior"'+(i===0?' disabled':'')+'>'+ICON.izq+'</button>';
      h+='<button class="flecha b" data-paso="1" data-id="'+esc(p.id)+'" aria-label="Foto siguiente"'+(i===fs.length-1?' disabled':'')+'>'+ICON.der+'</button>';
      h+='<span class="nfoto">'+(i+1)+' / '+fs.length+'</span>';
    }
    if(p.estado==='nuevo') h+='<span class="etiqueta">Nuevo</span>';
    else if(p.estado==='baja') h+='<span class="etiqueta baja">Baja de precio</span>';
    h+='<span class="sello si">Me gusta</span><span class="sello no">Ni de coña</span></div></div>';

    h+='<div class="der"><div class="alto"><div style="min-width:0">';
    h+='<h2 class="dir">'+esc(p.direccion)+'</h2>';
    h+='<p class="sitio">'+esc(p.zona||'')+(p.distancia_km!=null?' · a '+km(p.distancia_km)+' km de CIRCE':'')+'</p></div>';
    h+='<div class="precio"><b>'+eur(p.precio)+'</b>'+(p.precio_anterior?'<s>antes '+eur(p.precio_anterior)+'</s>':'')
      +(p.nota_precio?'<small>'+esc(p.nota_precio)+'</small>':'')+'</div></div>';
    h+='<dl class="tabla" style="margin:0">'
      +dato('Superficie',(p.m2!=null?p.m2+' m²':'—'))
      +dato('Habitaciones',(p.habitaciones||'—'))
      +dato('Baños',(p.banos||'—'))
      +dato('Planta',esc(p.planta||'—'),true)
      +dato('Orientación',p.exterior===true?'Exterior':p.exterior===false?'Interior':'—',true)
      +dato('Ascensor',p.ascensor===true?'Sí':p.ascensor===false?'No':'—',true)
      +dato('Muebles',mu,true)
      +dato('Precio por m²',(p.m2&&p.precio?Math.round(p.precio/p.m2)+' €':'—'))
      +dato('Andando',(p.andando_min!=null?p.andando_min+' min':'—'))
      +dato('En bici',(p.bici_min!=null?p.bici_min+' min':'—'))
      +dato('Puntuación',(p.puntuacion!=null?p.puntuacion+' / 100':'—'))
      +dato('Ficha',n+' de '+total)
      +'</dl>';
    if(p.lo_mejor) h+='<p class="frase mejor"><strong>Lo mejor:</strong> '+esc(p.lo_mejor)+'</p>';
    if(p.ojo) h+='<p class="frase ojo"><strong>Ojo:</strong> '+esc(p.ojo)+'</p>';
    h+='<div class="enlaces">'+(p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noreferrer">Abrir anuncio</a>':'')
      +'<a href="'+esc(mapaUrl(p))+'" target="_blank" rel="noreferrer">Ver en Google Maps</a>'
      +'<a href="'+esc(ruta(p))+'" target="_blank" rel="noreferrer">Ruta hasta CIRCE</a></div></div>';
    return h;
  }

  function ponerMapa(el,p,n){
    if(!window.L||p.lat==null||p.lng==null) return;
    var c=el.querySelector('.mapa'); if(!c||!c.offsetHeight) return;
    try{
      var m=L.map(c,{zoomControl:false,dragging:false,touchZoom:false,scrollWheelZoom:false,
        doubleClickZoom:false,boxZoom:false,keyboard:false,attributionControl:true});
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(m);
      var piso=[p.lat,p.lng], circe=(D.circe&&D.circe.lat!=null)?[D.circe.lat,D.circe.lng]:null;
      if(circe){
        L.polyline([piso,circe],{color:'#23434E',weight:2,dashArray:'5,6',opacity:.7}).addTo(m);
        L.circleMarker(circe,{radius:8,color:'#fff',weight:3,fillColor:'#A6482F',fillOpacity:1}).addTo(m);
      }
      L.circleMarker(piso,{radius:9,color:'#fff',weight:3,fillColor:'#2E7286',fillOpacity:1}).addTo(m);
      if(circe) m.fitBounds([piso,circe],{padding:[30,30]}); else m.setView(piso,15);
      mapas.push(m);
      setTimeout(function(){try{m.invalidateSize();}catch(e){}},60);
    }catch(e){}
  }
  function limpiarMapas(){mapas.forEach(function(m){try{m.remove();}catch(e){}});mapas=[];}

  function mover(el,x,y){
    el.style.transform='translate('+x+'px,'+(y*.2)+'px) rotate('+(x/26)+'deg)';
    el.querySelector('.sello.si').style.opacity=tope(x/105,0,1);
    el.querySelector('.sello.no').style.opacity=tope(-x/105,0,1);
  }
  function volar(el,p,d){
    if(el.dataset.fuera) return;
    el.dataset.fuera='1'; el.classList.add('suave');
    mover(el,d==='si'?innerWidth+400:-(innerWidth+400),160);
    setTimeout(function(){decidir(p,d);},280);
  }
  function pasarFoto(p,paso){
    var fs=pases(p); if(fs.length<2) return;
    foto[p.id]=tope((foto[p.id]||0)+paso,0,fs.length-1); pintar();
  }
  function arrastre(el,p){
    var s=null,x=0,y=0,anulado=false;
    el.addEventListener('pointerdown',function(e){
      if(el.dataset.fuera||e.target.closest('a,button')) return;
      s={x:e.clientX,y:e.clientY,t:Date.now(),der:!!e.target.closest('.der')};
      x=0;y=0;anulado=false; el.classList.remove('suave');
      try{el.setPointerCapture(e.pointerId);}catch(err){}
    });
    el.addEventListener('pointermove',function(e){
      if(!s||anulado) return;
      x=e.clientX-s.x; y=e.clientY-s.y;
      if(s.der&&Math.abs(y)>Math.abs(x)+8){anulado=true;el.classList.add('suave');mover(el,0,0);return;}
      mover(el,x,y);
    });
    function fin(){
      if(!s) return;
      var st=s; s=null; el.classList.add('suave');
      if(anulado) return;
      if(Math.abs(x)<9&&Math.abs(y)<9){mover(el,0,0);return;}
      var v=x/Math.max(1,Date.now()-st.t);
      if(x>110||(v>.65&&x>45)) volar(el,p,'si');
      else if(x<-110||(v<-.65&&x<-45)) volar(el,p,'no');
      else mover(el,0,0);
    }
    el.addEventListener('pointerup',fin);
    el.addEventListener('pointercancel',fin);
  }

  function decidir(p,d,apuntar){
    var x={id:p.id,d:d,dir:p.direccion||'',t:Date.now()};
    E.push(x); if(apuntar!==false) hist.push(x);
    if(d==='si'){
      COPIA[p.id]={piso:p,visto:D.fecha||hoy(),precio:p.precio};
      if(ORDEN.indexOf(p.id)<0) ORDEN.push(p.id);
      guardarFav();
    }
    guardar(); pintar();
  }
  function deshacer(){
    var x=hist.pop(); if(!x) return;
    var i=E.indexOf(x);
    if(i>=0&&!x.enviado) E.splice(i,1); else E.push({id:x.id,d:'reset',dir:x.dir,t:Date.now()});
    guardar(); tab='decidir'; pintar();
  }
  function cambiar(p,d){
    if(!p) return;
    for(var i=E.length-1;i>=0;i--){
      if(E[i].id===p.id){
        if(!E[i].enviado){E.splice(i,1); if(vigente(p.id)===d||(d==='reset'&&!vigente(p.id))){guardar();pintar();return;}}
        break;
      }
    }
    decidir(p,d,false);
  }

  function ficha(id){
    if(porId[id]) return porId[id];
    var c=COPIA[id];
    if(c&&c.piso) return c.piso;
    var dir='';
    E.forEach(function(x){if(x.id===id&&x.dir) dir=x.dir;});
    return {id:id, direccion:dir||'Piso guardado', zona:'', fotos:[],
            url:'https://www.idealista.com/inmueble/'+String(id).split('-')[1]+'/'};
  }
  function favoritos(){
    var v={}, out=[];
    ORDEN.forEach(function(id){ if(!v[id]&&vigente(id)==='si'){v[id]=1;out.push(ficha(id));} });
    for(var i=E.length-1;i>=0;i--){
      var id=E[i].id;
      if(!v[id]&&vigente(id)==='si'){v[id]=1;out.push(ficha(id));}
    }
    return out;
  }
  function sincronizar(){
    favoritos().forEach(function(p){
      var vivo=!!porId[p.id]&&!FUERA[p.id], c=COPIA[p.id]||{};
      if(porId[p.id]) c.piso=porId[p.id];
      if(vivo) c.visto=D.fecha||hoy();
      if(c.precio==null) c.precio=p.precio;
      COPIA[p.id]=c;
    });
    var ids=favoritos().map(function(p){return p.id;});
    ORDEN=ORDEN.filter(function(id){return ids.indexOf(id)>=0;});
    ids.forEach(function(id){if(ORDEN.indexOf(id)<0) ORDEN.push(id);});
    guardarFav();
  }
  function mover(dir, id){
    var i=ORDEN.indexOf(id); if(i<0) return;
    var j=i+dir; if(j<0||j>=ORDEN.length) return;
    var t=ORDEN[i]; ORDEN[i]=ORDEN[j]; ORDEN[j]=t;
    guardarFav(); pintar();
  }
  function estadoFav(p){
    var c=COPIA[p.id]||{}, vivo=!!porId[p.id]&&!FUERA[p.id];
    if(FUERA[p.id]) return {caido:true, txt:FUERA[p.id]+'. Sigue aquí porque lo marcaste'};
    if(!vivo) return {caido:true, txt:'Ya no aparece en la búsqueda. Visto por última vez el '+(c.visto||'?')};
    var act=porId[p.id].precio, ant=c.precio;
    if(ant!=null&&act!=null&&act<ant) return {txt:'Ha bajado de '+eur(ant)+' a '+eur(act), col:'var(--good)'};
    if(ant!=null&&act!=null&&act>ant) return {txt:'Ha subido de '+eur(ant)+' a '+eur(act), col:'var(--brick)'};
    return {txt:'Sigue publicado', col:'var(--muted)'};
  }
  function favHTML(p,i,n){
    var f=(p.fotos||[]).filter(Boolean)[0], st=estadoFav(p), top=i<3;
    var h='<div class="fila'+(st.caido?' caida':'')+'"'+(st.caido?' title="'+esc(st.txt)+'"':'')+'>';
    h+='<div class="pos'+(top&&!st.caido?' top':'')+'">'+(i+1)+'</div>';
    h+='<div class="mini">'+(f?'<img src="'+esc(urlFoto(f))+'" alt="" referrerpolicy="no-referrer" onerror="this.remove()">':'')+'</div>';
    var t=st.caido?' class="tachado"':'';
    h+='<div class="cuerpo"><div class="alto"><h3'+t+'>'+esc(p.direccion)+'</h3><span class="p'
      +(st.caido?' tachado':'')+'">'+eur(p.precio)+'</span></div>';
    h+='<p class="z">'+esc(p.zona||'')+(p.m2?', '+p.m2+' m²':'')+(p.habitaciones?', '+p.habitaciones+' hab':'')
      +(p.distancia_km!=null?', a '+km(p.distancia_km)+' km de CIRCE':'')+'</p>';
    if(st.caido) h+='<p class="cambio" style="color:var(--brick)">'+esc(st.txt)+'</p>';
    else if(st.txt!=='Sigue publicado') h+='<p class="cambio" style="color:'+st.col+'">'+esc(st.txt)+'</p>';
    h+='<div class="acc">';
    if(p.url) h+='<a href="'+esc(p.url)+'" target="_blank" rel="noreferrer">Abrir anuncio</a>';
    h+='<a href="'+esc(ruta(p))+'" target="_blank" rel="noreferrer">Ruta a CIRCE</a>';
    h+='<button class="rojo" data-accion="no" data-id="'+esc(p.id)+'">Descartar</button></div></div>';
    h+='<div class="ordenar">'
      +'<button data-sube="'+esc(p.id)+'" aria-label="Subir"'+(i===0?' disabled':'')+'>&#9650;</button>'
      +'<button data-baja="'+esc(p.id)+'" aria-label="Bajar"'+(i===n-1?' disabled':'')+'>&#9660;</button></div>';
    return h+'</div>';
  }
  function descHTML(p){
    var f=(p.fotos||[]).filter(Boolean)[0];
    var h='<div class="fila corta"><div class="mini">'
      +(f?'<img src="'+esc(urlFoto(f))+'" alt="" referrerpolicy="no-referrer" onerror="this.remove()">':'')+'</div>';
    h+='<div class="cuerpo"><div class="alto"><h3 class="tachado">'+esc(p.direccion)+'</h3>'
      +'<span class="p tachado">'+eur(p.precio)+'</span></div>';
    h+='<p class="z">'+esc(p.zona||'')+(p.m2?', '+p.m2+' m²':'')+'</p>';
    h+='<div class="acc"><button data-accion="reset" data-id="'+esc(p.id)+'">Recuperar</button></div>';
    return h+'</div></div>';
  }
  function lotes(){
    var pend=E.filter(function(x){return !x.enviado;});
    if(!pend.length||!D.destinatario) return [];
    var movil=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
    function cuerpo(xs,dir){return xs.map(function(x){return x.d+' '+x.id+(dir&&x.dir?' | '+x.dir:'');}).join('\n');}
    function url(b,n,t){
      var su='[Radar pisos] decisiones '+D.fecha+(t>1?' ('+n+' de '+t+')':'');
      return movil?'mailto:'+D.destinatario+'?subject='+encodeURIComponent(su)+'&body='+encodeURIComponent(b)
        :'https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(D.destinatario)+'&su='+encodeURIComponent(su)+'&body='+encodeURIComponent(b);
    }
    var u=url(cuerpo(pend,true),1,1); if(u.length<=1900) return [{url:u,xs:pend,movil:movil}];
    u=url(cuerpo(pend,false),1,1);   if(u.length<=1900) return [{url:u,xs:pend,movil:movil}];
    var g=[]; for(var i=0;i<pend.length;i+=30) g.push(pend.slice(i,i+30));
    return g.map(function(xs,k){return {url:url(cuerpo(xs,false),k+1,g.length),xs:xs,movil:movil};});
  }
  function copiar(){
    var pend=E.filter(function(x){return !x.enviado;});
    var t=(D.destinatario?'Para: '+D.destinatario+'\n':'')+'Asunto: [Radar pisos] decisiones '+D.fecha+'\n\n'
      +pend.map(function(x){return x.d+' '+x.id+(x.dir?' | '+x.dir:'');}).join('\n');
    var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);
    if(navigator.clipboard) navigator.clipboard.writeText(t).catch(function(){});
    pend.forEach(function(x){x.enviado=true;}); guardar(); pintarEnvio();
    alert('Copiado. Pégalo en un correo y envíalo.');
  }
  function pintarEnvio(){
    var caja=document.getElementById('envio'), pend=E.filter(function(x){return !x.enviado;}).length;
    if(!E.length){caja.hidden=true;return;}
    caja.hidden=false;
    document.getElementById('envio-txt').textContent=pend
      ?(pend===1?'1 decisión sin enviar':pend+' decisiones sin enviar')+'. Se aplican mañana.':'Todo enviado.';
    var b=document.getElementById('envio-btns'); b.innerHTML='';
    if(pend&&!D.destinatario){
      var q=document.createElement('button'); q.className='btn'; q.textContent='Elegir dirección'; q.onclick=pedirDireccion; b.appendChild(q);
    }
    lotes().forEach(function(l,k,a){
      var el=document.createElement('a'); el.className='btn'; el.href=l.url;
      if(!l.movil){el.target='_blank';el.rel='noreferrer';}
      el.textContent=a.length>1?'Enviar parte '+(k+1):'Enviar decisiones';
      el.addEventListener('click',function(){setTimeout(function(){l.xs.forEach(function(x){x.enviado=true;});guardar();pintarEnvio();},400);});
      b.appendChild(el);
    });
    if(pend){var c=document.createElement('button');c.className='btn sec';c.textContent='Copiar';c.onclick=copiar;b.appendChild(c);}
    if(D.destinatario){var m=document.createElement('button');m.className='btn sec';m.textContent='Dirección';m.title=D.destinatario;m.onclick=pedirDireccion;b.appendChild(m);}
  }

  function pintar(){
    limpiarMapas();
    sincronizar();
    var P=pila(), F=favoritos(), X=porDec('no');
    var T=[['decidir','Decidir',P.length],['si','Favoritos',F.length],['no','Descartados',X.length]];
    document.getElementById('tabs').innerHTML=T.map(function(t){
      return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'<span class="n">'+t[2]+'</span></button>';}).join('');
    if(D.fecha){var fe=new Date(D.fecha+'T12:00:00');
      document.getElementById('dia').textContent=isNaN(fe)?D.fecha:fe.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});}
    var v=document.getElementById('vista'); arriba=null;

    if(tab==='decidir'){
      if(!P.length){
        v.innerHTML='<div class="panel"><h2>No queda nada por decidir</h2><p>'
          +(E.some(function(x){return !x.enviado;})?'Pulsa «Enviar decisiones» abajo para que cuenten mañana.':'Mañana a las 8:00 llegan los nuevos.')+'</p></div>';
      }else{
        var total=D.pisos.length, n=total-P.length+1;
        v.innerHTML='<div class="pila" id="pila"></div><div class="mandos">'
          +'<div class="mando"><button class="redondo" id="b-no" aria-label="Ni de coña" style="width:64px;height:64px;color:var(--brick);border-color:var(--brick)">'+ICON.no+'</button>Ni de coña</div>'
          +'<div class="mando"><button class="redondo" id="b-atras" aria-label="Deshacer" style="width:46px;height:46px;color:var(--muted);border-color:var(--line)"'+(hist.length?'':' disabled')+'>'+ICON.atras+'</button>Deshacer</div>'
          +'<div class="mando"><button class="redondo" id="b-si" aria-label="Me gusta" style="width:64px;height:64px;color:#fff;background:var(--good);border-color:var(--good)">'+ICON.si+'</button>Me gusta</div>'
          +'</div><p class="ayuda">Arrastra la tarjeta a un lado, usa los botones o las flechas del teclado. Las flechitas de la foto pasan las imágenes.</p>';
        var pl=document.getElementById('pila');
        if(P[1]){var b=document.createElement('article');b.className='tarjeta detras';b.innerHTML=tarjeta(P[1],n+1,total);pl.appendChild(b);}
        var t=document.createElement('article');t.className='tarjeta';t.innerHTML=tarjeta(P[0],n,total);pl.appendChild(t);
        arrastre(t,P[0]); arriba={el:t,p:P[0]};
        if((pases(P[0])[foto[P[0].id]||0]||{}).t==='m') ponerMapa(t,P[0],n);
        document.getElementById('b-no').onclick=function(){volar(t,P[0],'no');};
        document.getElementById('b-si').onclick=function(){volar(t,P[0],'si');};
        document.getElementById('b-atras').onclick=deshacer;
      }
    }else if(tab==='si'){
      if(F.length){
        var h='<p class="nota-orden">Ordénalos con las flechas: el primero es el que más te gusta.</p>';
        v.innerHTML=h+F.map(function(p,i){return favHTML(p,i,F.length);}).join('');
      }else{
        v.innerHTML='<div class="panel"><h2>Sin favoritos todavía</h2><p>Arrastra a la derecha los pisos que te gusten.</p></div>';
      }
    }else{
      v.innerHTML=X.length?'<p class="nota-orden">No volverán a salir, aunque se republiquen.</p>'
        +X.map(descHTML).join('')
        :'<div class="panel"><h2>Sin descartes</h2><p>Aquí aparece lo que arrastres a la izquierda.</p></div>';
    }
    v.querySelectorAll('[data-accion]').forEach(function(b){
      b.onclick=function(){cambiar(porId[b.dataset.id]||(COPIA[b.dataset.id]&&COPIA[b.dataset.id].piso),b.dataset.accion);};
    });
    v.querySelectorAll('[data-sube]').forEach(function(b){b.onclick=function(){mover(-1,b.dataset.sube);};});
    v.querySelectorAll('[data-baja]').forEach(function(b){b.onclick=function(){mover(1,b.dataset.baja);};});
    v.querySelectorAll('[data-paso]').forEach(function(b){b.onclick=function(ev){ev.stopPropagation();pasarFoto(porId[b.dataset.id],Number(b.dataset.paso));};});
    pintarEnvio();
  }

  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-tab]'); if(t){tab=t.dataset.tab;pintar();}
  });
  document.addEventListener('keydown',function(e){
    if(tab!=='decidir'||!arriba) return;
    if(e.key==='ArrowRight') volar(arriba.el,arriba.p,'si');
    else if(e.key==='ArrowLeft') volar(arriba.el,arriba.p,'no');
    else if(e.key==='Backspace'){e.preventDefault();deshacer();}
  });
  addEventListener('beforeunload',function(e){
    if(E.some(function(x){return !x.enviado;})){e.preventDefault();e.returnValue='';}
  });

  fetch('datos.json?v='+Date.now()).then(function(r){
    if(!r.ok) throw new Error('No se ha podido leer datos.json ('+r.status+')');
    return r.json();
  }).then(function(j){
    var propio=D.destinatario;
    Object.keys(j).forEach(function(k){D[k]=j[k];});
    D.pisos=j.pisos||[]; D.destinatario=propio||j.destinatario||'';
    indexar(); pintar();
  }).catch(function(err){
    document.getElementById('vista').innerHTML='<div class="panel"><h2>No hay datos que mostrar</h2><p>'+esc(err.message)+'</p></div>';
  });
})();
</script>
